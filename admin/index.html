<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel Sogaysé</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <div class="titulo"><small>Panel de</small><strong>Florería Sogaysé</strong></div>
    <span class="chip" id="chip-modo">Modo prueba</span>
    <a class="btn btn-borde" href="../index.html" id="ver-pagina">Ver la página</a>
  </div>
  <nav class="pestanas" role="tablist" aria-label="Secciones del panel">
    <button type="button" role="tab" id="tab-productos" aria-selected="true" data-tab="productos">Productos</button>
    <button type="button" role="tab" id="tab-datos" aria-selected="false" data-tab="datos">Datos de la florería</button>
    <button type="button" role="tab" id="tab-conexion" aria-selected="false" data-tab="conexion">Publicación</button>
  </nav>
</header>

<main class="contenido" id="contenido"><p class="vacio">Cargando…</p></main>

<div class="guardar-barra" id="guardar-barra">
  <span id="estado-guardado">Sin cambios</span>
  <button type="button" class="btn btn-principal" id="btn-guardar" disabled>Guardar cambios</button>
</div>

<dialog id="editor" class="editor" aria-labelledby="editor-titulo"></dialog>
<dialog id="confirmar" class="confirmar"></dialog>
<div class="aviso-flotante" id="aviso" role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
